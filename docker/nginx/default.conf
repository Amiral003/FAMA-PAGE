server {
    listen 80;
    server_name fama.mil.ml www.fama.mil.ml;

    return 301 https://fama.mil.ml$request_uri;
}

server {
    listen 443 ssl;
    server_name www.fama.mil.ml;

    ssl_certificate /etc/letsencrypt/live/fama.mil.ml/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/fama.mil.ml/privkey.pem;

    return 301 https://fama.mil.ml$request_uri;
}

server {
    listen 443 ssl;
    server_name fama.mil.ml;

    ssl_certificate /etc/letsencrypt/live/fama.mil.ml/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/fama.mil.ml/privkey.pem;

    root /var/www/html/public;
    index index.php index.html;
    server_tokens off;

gzip on;
gzip_vary on;
gzip_min_length 1024;
gzip_comp_level 5;
gzip_types
    text/plain
    text/css
    text/javascript
    application/javascript
    application/json
    application/xml
    application/rss+xml
    image/svg+xml;

add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "SAMEORIGIN" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    client_max_body_size 64M;

     location = /sitemap.xml {
        alias /var/www/html/storage/app/generated/sitemap.xml;
        default_type application/xml;
    }

    location ^~ /build/assets/ {
    try_files $uri =404;

    expires 1y;
    add_header Cache-Control "public, max-age=31536000, immutable";
    access_log off;
}

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        fastcgi_pass app:9000;
        fastcgi_index index.php;

        include fastcgi_params;

        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param PATH_INFO $fastcgi_path_info;

        fastcgi_hide_header X-Powered-By;
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }
}
