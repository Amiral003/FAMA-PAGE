server {
    listen 80;
    server_name fama.mil.ml www.fama.mil.ml;

    return 301 https://fama.mil.ml$request_uri;
}

server {
    listen 443 ssl;
    server_name www.fama.mil.ml;

    ssl_certificate /etc/letsencrypt/live/fama.mil.ml/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/fama.mil.ml/privkey.pem;

    return 301 https://fama.mil.ml$request_uri;
}

server {
    listen 443 ssl;
    server_name fama.mil.ml;

    ssl_certificate /etc/letsencrypt/live/fama.mil.ml/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/fama.mil.ml/privkey.pem;

    root /var/www/html/public;
    index index.php index.html;

    client_max_body_size 25M;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        fastcgi_pass app:9000;
        fastcgi_index index.php;

        include fastcgi_params;

        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param PATH_INFO $fastcgi_path_info;
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }
}
